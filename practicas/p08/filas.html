<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Ejercicio 2 - Columnas</title>

    <style type="text/css">
        td, th {
            border: 1px solid #CCC;
        }

        table {
            border: 1px solid black;
        }
    </style>
</head>

<body>

    <table>
        <tr>
            <td>apples</td>
            <td rowspan="3">oranges</th>
            <td>pears</th>
        </tr>

        <tr>
            <td>bananas</td>
            <td rowspan="3">pineapple</td>

        </tr>
        <tr>
            <td>lychees</td>
        </tr>
    </table>

</body>
</html>
